<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Splits">
<link rel="apple-touch-icon" href="icon.png">
<title>Splits</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #000;
  --surface: #111;
  --surface2: #1a1a1a;
  --border: #2a2a2a;
  --border2: #333;
  --text: #fff;
  --text2: #ccc;
  --muted: #666;
  --accent: #0066ff;
  --accent-dim: rgba(0,102,255,0.12);
  --accent-border: rgba(0,102,255,0.3);
  --green: #00c853;
  --orange: #ff9500;
  --red: #ff3b30;
  --blue-light: #4d9fff;
  --tab: 58px;
  --r: 10px;
  --r-sm: 6px;
  --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  max-width: 430px;
  margin: 0 auto;
  min-height: 100vh;
  padding-bottom: var(--tab);
  -webkit-font-smoothing: antialiased;
}

.tabs {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 430px; height: var(--tab);
  background: rgba(0,0,0,0.92);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  display: flex; z-index: 50;
}
.tab {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 3px;
  background: none; border: none; cursor: pointer;
  color: var(--muted); font-family: var(--font);
  font-size: 10px; font-weight: 500; letter-spacing: 0.02em;
  transition: color 0.2s;
}
.tab .icon { font-size: 22px; line-height: 1; }
.tab.active { color: var(--accent); }

.screen { display: none; }
.screen.active { display: block; }

.hdr {
  padding: 16px 20px 14px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0;
  background: rgba(0,0,0,0.92);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border); z-index: 10;
}
.hdr-title { font-size: 17px; font-weight: 700; color: var(--text); letter-spacing: -0.3px; }
.hdr-date { font-size: 13px; color: var(--muted); }
.hdr-btn {
  background: var(--surface); color: var(--text2);
  font-family: var(--font); font-size: 13px; font-weight: 500;
  padding: 6px 14px; border-radius: 20px; border: none; cursor: pointer;
  min-height: 32px;
}
.hdr-btn:active { opacity: 0.7; }

.macro-section {
  margin: 16px 20px;
  background: var(--surface);
  border-radius: var(--r);
  padding: 16px;
  border: 1px solid var(--border);
}
.macro-total { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 14px; }
.macro-kcal { font-size: 32px; font-weight: 700; color: var(--text); letter-spacing: -1px; line-height: 1; }
.macro-kcal-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.macro-kcal-target { font-size: 12px; color: var(--muted); text-align: right; }
.macro-bars { display: flex; flex-direction: column; gap: 9px; }
.macro-row { display: flex; align-items: center; gap: 10px; }
.macro-label { font-size: 11px; font-weight: 600; color: var(--muted); width: 46px; text-transform: uppercase; letter-spacing: 0.05em; flex-shrink: 0; }
.macro-bar-wrap { flex: 1; height: 4px; background: var(--border2); border-radius: 2px; overflow: hidden; }
.macro-bar { height: 100%; border-radius: 2px; transition: width 0.4s ease; }
.macro-bar.protein { background: var(--accent); }
.macro-bar.carbs { background: var(--blue-light); }
.macro-bar.fat { background: var(--orange); }
.macro-bar.fiber { background: #555; }
.macro-val { font-size: 11px; font-weight: 600; color: var(--text2); width: 64px; text-align: right; flex-shrink: 0; }
.macro-chat-wrap { margin-top: 14px; display: flex; gap: 8px; }
.macro-chat-input {
  flex: 1; background: var(--surface2); border: 1px solid var(--border2);
  border-radius: 20px; color: var(--text); font-family: var(--font);
  font-size: 14px; padding: 9px 14px; outline: none; min-height: 40px;
}
.macro-chat-input:focus { border-color: var(--accent); }
.macro-chat-input::placeholder { color: var(--muted); }
.macro-chat-send {
  background: var(--accent); color: #fff; border: none;
  border-radius: 50%; width: 40px; height: 40px; font-size: 16px;
  cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
}
.macro-chat-send:active { opacity: 0.8; }
.macro-status { font-size: 12px; color: var(--muted); margin-top: 8px; min-height: 16px; line-height: 1.4; }

.section { padding: 0 20px; margin-bottom: 4px; }
.section-title { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }

.wk-list { background: var(--surface); border-radius: var(--r); border: 1px solid var(--border); overflow: hidden; margin-bottom: 16px; }
.wk-btn {
  width: 100%; text-align: left; background: none; border: none;
  border-bottom: 1px solid var(--border);
  padding: 14px 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: space-between;
  font-family: var(--font); min-height: 60px;
  transition: background 0.15s;
}
.wk-btn:last-child { border-bottom: none; }
.wk-btn:active { background: var(--surface2); }
.wk-btn-name { font-size: 15px; font-weight: 600; color: var(--text); }
.wk-btn-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.wk-btn-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.wk-btn-last { font-size: 12px; color: var(--muted); }
.wk-btn-arrow { color: var(--border2); font-size: 20px; }

.act-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
.act-btn {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); padding: 14px 12px; cursor: pointer;
  font-family: var(--font); font-size: 14px; font-weight: 500;
  color: var(--text2); text-align: left;
  display: flex; align-items: center; gap: 8px;
  min-height: 52px; transition: background 0.15s;
}
.act-btn:active { background: var(--surface2); }
.act-btn .act-icon { font-size: 20px; }

.wv-hdr {
  padding: 14px 20px 12px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0;
  background: rgba(0,0,0,0.92);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border); z-index: 10;
}
.wv-title { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
.wv-badge {
  font-size: 12px; font-weight: 600; color: var(--accent);
  background: var(--accent-dim); border: 1px solid var(--accent-border);
  padding: 4px 10px; border-radius: 20px;
}
.wv-goal { padding: 10px 20px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--border); }
.wv-content { padding: 12px 20px 20px; display: flex; flex-direction: column; gap: 8px; }

.ex-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); overflow: hidden;
}
.ex-hdr {
  padding: 14px 16px; cursor: pointer;
  display: flex; align-items: center; gap: 10px;
  min-height: 60px; transition: background 0.15s;
}
.ex-hdr:active { background: var(--surface2); }
.ex-hdr-left { flex: 1; min-width: 0; }
.ex-hdr-name { font-size: 15px; font-weight: 600; color: var(--text); }
.ex-hdr-scheme { font-size: 12px; color: var(--muted); margin-top: 2px; }
.ex-hdr-right { text-align: right; flex-shrink: 0; }
.ex-last { font-size: 12px; color: var(--accent); font-weight: 600; }
.ex-last-date { font-size: 11px; color: var(--muted); margin-top: 2px; }
.ch { color: var(--muted); font-size: 11px; transition: transform 0.2s; flex-shrink: 0; }
.ex-card.open .ch { transform: rotate(180deg); }
.ex-body { display: none; padding: 0 16px 16px; border-top: 1px solid var(--border); }
.ex-card.open .ex-body { display: block; }

.dose-row { display: flex; align-items: center; gap: 12px; padding: 12px 0 6px; min-height: 48px; }
.dose-check {
  width: 26px; height: 26px; border: 1.5px solid var(--border2);
  border-radius: 50%; cursor: pointer; display: flex; align-items: center;
  justify-content: center; flex-shrink: 0; background: none; transition: all 0.2s;
}
.dose-check.checked { background: var(--accent); border-color: var(--accent); }
.dose-check.checked::after { content: '¹3'; color: #fff; font-size: 13px; font-weight: 700; }
.dose-label { font-size: 14px; color: var(--text2); }
.dose-expand { font-size: 12px; color: var(--accent); cursor: pointer; margin-left: auto; font-weight: 500; }

.hist { margin: 10px 0 8px; }
.hist-row { display: flex; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; align-items: center; }
.hist-row:last-child { border-bottom: none; }
.hist-date { color: var(--muted); width: 54px; flex-shrink: 0; font-size: 12px; }
.hist-sets { flex: 1; color: var(--text2); }
.hist-reps { color: var(--muted); flex-shrink: 0; font-size: 12px; }
.edit-btn { background: none; border: none; color: var(--muted); font-family: var(--font); font-size: 12px; padding: 4px 8px; cursor: pointer; flex-shrink: 0; border-radius: 4px; min-height: 28px; }
.edit-btn:active { background: var(--surface2); }

.divider { height: 1px; background: var(--border); margin: 10px 0; }
.log-lbl { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 8px; }
.sets-wrap { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
.set-row { display: flex; gap: 6px; align-items: center; }
.set-n { font-size: 12px; color: var(--muted); width: 16px; text-align: right; flex-shrink: 0; font-weight: 500; }
.set-row input {
  background: var(--surface2); border: 1px solid var(--border2);
  border-radius: var(--r-sm); color: var(--text); font-family: var(--font);
  font-size: 15px; font-weight: 500;
  padding: 8px 10px; text-align: center; outline: none;
  -webkit-appearance: none; min-width: 0; min-height: 40px;
  transition: border-color 0.15s;
}
.set-row input:focus { border-color: var(--accent); }
.set-row input::placeholder { color: var(--muted); font-size: 12px; }
.wi { width: 70px; } .ri { width: 62px; }
.ni { flex: 1; text-align: left; font-size: 14px; }
.x-lbl { font-size: 14px; color: var(--muted); flex-shrink: 0; }
.rm-set { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 20px; padding: 0 4px; min-height: 40px; min-width: 32px; display: flex; align-items: center; }
.btns { display: flex; gap: 8px; margin-top: 8px; }
.btn { border: none; border-radius: 20px; cursor: pointer; font-family: var(--font); font-size: 14px; font-weight: 600; padding: 10px 16px; transition: opacity 0.15s; white-space: nowrap; min-height: 42px; display: flex; align-items: center; justify-content: center; }
.btn:active { opacity: 0.7; }
.btn-add { background: var(--surface2); border: 1px solid var(--border2); color: var(--text2); }
.btn-log { background: var(--accent); color: #fff; font-weight: 700; flex: 1; }
.date-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.date-lbl { font-size: 13px; color: var(--muted); flex-shrink: 0; }
.date-in { background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--r-sm); color: var(--text); font-family: var(--font); font-size: 13px; padding: 7px 10px; outline: none; flex: 1; color-scheme: dark; min-height: 36px; }
.date-in:focus { border-color: var(--accent); }
.target-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.target-in { width: 64px; background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--r-sm); color: var(--text); font-family: var(--font); font-size: 14px; padding: 7px 8px; outline: none; text-align: center; min-height: 36px; }
.target-in:focus { border-color: var(--accent); }
.total-lbl { font-size: 13px; color: var(--muted); }

.variant-row { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 0 4px; }
.variant-btn { background: var(--surface2); border: 1px solid var(--border2); border-radius: 20px; padding: 6px 14px; cursor: pointer; font-family: var(--font); font-size: 12px; font-weight: 600; color: var(--muted); min-height: 32px; transition: all 0.15s; }
.variant-btn.selected { background: var(--accent); color: #fff; border-color: var(--accent); }

.cal-wrap { padding: 16px 20px; }
.cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.cal-month { font-size: 16px; font-weight: 700; color: var(--text); letter-spacing: -0.3px; }
.cal-nav-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text2); cursor: pointer; font-size: 16px; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.cal-nav-btn:active { opacity: 0.7; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.cal-dl { font-size: 10px; font-weight: 600; text-transform: uppercase; color: var(--muted); text-align: center; padding-bottom: 6px; letter-spacing: 0.04em; }
.cal-d { aspect-ratio: 1; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--muted); }
.cal-d.today { color: var(--text); font-weight: 700; background: var(--surface2); }
.cal-d.gym { background: #fff; color: #000; font-weight: 700; }
.cal-d.surf { background: #0099ff; color: #fff; font-weight: 600; }
.cal-d.session { background: var(--orange); color: #fff; font-weight: 600; }
.cal-d.rest { background: var(--surface2); color: var(--muted); }
.cal-d.sick { background: rgba(255,59,48,0.2); color: var(--red); }

.feed { padding: 0 20px 16px; display: flex; flex-direction: column; gap: 10px; }
.feed-day { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 12px 14px; }
.feed-day-hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.feed-day-date { font-size: 14px; font-weight: 600; color: var(--text); }
.feed-day-tag { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 3px 9px; border-radius: 20px; }
.tag-gym { color: var(--accent); background: var(--accent-dim); }
.tag-surf { color: #0099ff; background: rgba(0,153,255,0.12); }
.tag-session { color: var(--orange); background: rgba(255,149,0,0.12); }
.tag-rest { color: var(--muted); background: var(--surface2); }
.tag-sick { color: var(--red); background: rgba(255,59,48,0.1); }
.feed-ex { display: flex; gap: 8px; padding: 4px 0; font-size: 13px; border-bottom: 1px solid var(--border); }
.feed-ex:last-child { border-bottom: none; }
.feed-ex-name { color: var(--muted); width: 110px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
.feed-ex-sets { flex: 1; color: var(--text2); }
.feed-macro { padding: 6px 0 2px; font-size: 12px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
.feed-macro span { color: var(--text); font-weight: 600; }

.backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: flex-end; justify-content: center; }
.backdrop.on { display: flex; }
.sheet { background: var(--surface); border-top: 1px solid var(--border2); border-radius: 16px 16px 0 0; padding: 20px 20px 36px; width: 100%; max-width: 430px; }
.sheet-handle { width: 36px; height: 4px; background: var(--border2); border-radius: 2px; margin: 0 auto 16px; }
.sheet-title { font-size: 17px; font-weight: 700; color: var(--text); margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; letter-spacing: -0.3px; }
.sheet-close { background: var(--surface2); border: none; color: var(--text2); font-size: 16px; cursor: pointer; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.field-lbl { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
.field-in { width: 100%; background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--r-sm); color: var(--text); font-family: var(--font); font-size: 15px; padding: 12px 14px; outline: none; margin-bottom: 14px; min-height: 46px; transition: border-color 0.15s; }
.field-in:focus { border-color: var(--accent); }
.field-hint { font-size: 12px; color: var(--muted); margin: -10px 0 14px; }
.macro-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.macro-field { display: flex; flex-direction: column; gap: 5px; }
.macro-field label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.macro-field input { background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--r-sm); color: var(--text); font-family: var(--font); font-size: 20px; font-weight: 600; padding: 12px 10px; outline: none; text-align: center; -webkit-appearance: none; min-height: 50px; }
.macro-field input:focus { border-color: var(--accent); }
.big-btn { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 12px; padding: 14px; font-family: var(--font); font-size: 15px; font-weight: 700; cursor: pointer; margin-bottom: 10px; min-height: 50px; transition: opacity 0.15s; }
.big-btn:active { opacity: 0.85; }
.cancel-btn { width: 100%; background: var(--surface2); border: none; color: var(--text2); border-radius: 12px; padding: 14px; font-family: var(--font); font-size: 15px; cursor: pointer; min-height: 50px; }
.sheet-btns { display: flex; gap: 8px; }
.sheet-btn { flex: 1; border: none; border-radius: 12px; cursor: pointer; font-family: var(--font); font-size: 14px; font-weight: 600; padding: 13px; min-height: 48px; }
.sheet-btn-cancel { background: var(--surface2); color: var(--text2); }
.sheet-btn-save { background: var(--accent); color: #fff; }
.sheet-btn-del { background: rgba(255,59,48,0.12); color: var(--red); border: 1px solid rgba(255,59,48,0.2); flex: 0; padding: 13px 16px; }

.effort-row { display: flex; gap: 6px; margin-bottom: 16px; }
.eff-btn { flex: 1; background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--r-sm); padding: 10px; cursor: pointer; font-family: var(--font); font-size: 15px; font-weight: 600; color: var(--muted); min-height: 44px; transition: all 0.15s; }
.eff-btn.on { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }

.settings-wrap { padding: 16px 20px; display: flex; flex-direction: column; gap: 24px; }
.settings-section {}
.settings-section-title { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }

.toast { position: fixed; bottom: 76px; left: 50%; transform: translateX(-50%) translateY(16px); background: rgba(30,30,30,0.95); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: var(--text); font-family: var(--font); font-size: 13px; font-weight: 500; padding: 10px 18px; border-radius: 20px; border: 1px solid var(--border2); transition: transform 0.25s, opacity 0.25s; z-index: 200; white-space: nowrap; opacity: 0; pointer-events: none; }
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>

<!-- ── SCREEN: LOG ── -->
<div class="screen active" id="s-log">

  <!-- home view -->
  <div id="home-view">
    <div class="hdr">
      <div class="hdr-title">Splits</div>
      <div class="hdr-date" id="hdr-date"></div>
    </div>

    <!-- Workouts -->
    <div class="section">
      <div class="section-title">Workouts</div>
      <div class="wk-list">
      <button class="wk-btn" onclick="selectWorkout('upper1')">
        <div class="wk-btn-left">
          <div class="wk-btn-name">Upper 1</div>
          <div class="wk-btn-sub">Priority · Weighted pull-ups · OHP · Laterals</div>
        </div>
        <div class="wk-btn-right"><div class="wk-btn-last" id="last-upper1"></div><div class="wk-btn-arrow">›</div></div>
      </button>
      <button class="wk-btn" onclick="selectWorkout('lower')">
        <div class="wk-btn-left">
          <div class="wk-btn-name">Lower</div>
          <div class="wk-btn-sub">RDL · After surf days · Never &lt;24h before</div>
        </div>
        <div class="wk-btn-right"><div class="wk-btn-last" id="last-lower"></div><div class="wk-btn-arrow">›</div></div>
      </button>
      <button class="wk-btn" onclick="selectWorkout('upper2')">
        <div class="wk-btn-left">
          <div class="wk-btn-name">Upper 2</div>
          <div class="wk-btn-sub">Land weeks only · AMRAP pull-ups · Chest</div>
        </div>
        <div class="wk-btn-right"><div class="wk-btn-last" id="last-upper2"></div><div class="wk-btn-arrow">›</div></div>
      </button>
      <button class="wk-btn" onclick="selectWorkout('kb')">
        <div class="wk-btn-left">
          <div class="wk-btn-name">KB Session</div>

// ── STATE ─────────────────────────────────────────────────────────────────────

let localLog = {};

try { localLog = JSON.parse(localStorage.getItem('gymlog_v2') || '{}'); } catch(e) {}

function fmt(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fmtFromDisplay(s) {
  try {
    const [m, d, y] = s.split('/');
    const year = parseInt(y) < 100 ? 2000 + parseInt(y) : parseInt(y);
    return `${year}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  } catch(e) { return s; }
}
function showToast(msg) {

  setTimeout(() => t.classList.remove('show'), 1800);

function dbg(msg) {

  if (el) { const d = document.createElement('div'); d.style.cssText = 'border-bottom:1px solid #222;padding:2px 0'; d.textContent = msg; el.appendChild(d); }

// ── MACROS ────────────────────────────────────────────────────────────────────







// ── HISTORY / SHEET PARSING ───────────────────────────────────────────────────
const ID_ALIASES = {
  'trap_rdl': 'rdl', 'jefferson_curl': 'rdl', 'bss_rdl': 'rdl',
  'hip_thrust_kb_swings': 'kb_swings', 'rev_nordic_leg_lifts': 'rev_nordic',
  'core_a': 'sad_core', 'serratus': 'sad_core', 'straight_arm_pulldown': 'sad_core',
  'hanging_knee_raise': 'sad_core', 'cable_chop': 'sad_core',
  'lat_raise_a': 'lat_raise', 'lat_raise_b': 'lat_raise',
  'pullups_b': 'pullups_amrap', 'pu_pump': 'pullups', 'pullups_travel': 'pullups',
  'curls_b': null, 'curls': null, 'curls_pump': null,
  'chest_press_b': null, 'calves': null, 'cossack_finisher': null,
  'cable_fly': null, 'rope_pd': null, 'rear_delt': 'lat_raise',
  'incline_db': 'incline_db', 'bss': 'bss', 'ohp': 'ohp',
  'cable_row': 'cable_row', 'hip_thrust': null,
};

const ALL_IDS = new Set(Object.values(WORKOUTS).flatMap(w => w.exercises.map(e => e.id)));

function resolveId(rawId) {
  if (rawId === 'Note') return 'Note';
  if (ALL_IDS.has(rawId)) return rawId;
  if (ID_ALIASES[rawId] !== undefined) return ID_ALIASES[rawId]; // null = retired
  return rawId;
}

function parseSheetLog() {
  const byId = {};
  for (let i = 1; i < sheetLog.length; i++) {
    const [rawDate, workout, rawExId, sets] = sheetLog[i];
    if (!rawExId || !sets) continue;
    const exId = resolveId(rawExId);
    if (!exId) continue; // retired

    let iso = '', displayDate = '';
    try {
      const d = new Date(rawDate);
      if (!isNaN(d)) { iso = fmt(d); displayDate = d.toLocaleDateString('en-US',{month:'numeric',day:'numeric',year:'2-digit'}); }
      else { iso = String(rawDate); displayDate = String(rawDate); }
    } catch(e) { iso = String(rawDate); displayDate = String(rawDate); }

    if (!byId[exId]) byId[exId] = [];
    byId[exId].push({ iso, date: displayDate, sets: String(sets), workout, sheetRow: i+1 });
  }
  return byId;
}

function getAllHistory(exId) {
  const parsed = parseSheetLog();
  const fromSheet = parsed[exId] || [];
  const local = (localLog[exId] || []).filter(l => !fromSheet.some(s => s.date===l.date && s.sets===l.sets));
  return [...fromSheet, ...local].sort((a,b) => {
    const da = new Date(a.iso||fmtFromDisplay(a.date)), db = new Date(b.iso||fmtFromDisplay(b.date));
    return isNaN(da)||isNaN(db) ? 0 : da-db;
  });
}

function getDayData(iso) {
  const parsed = parseSheetLog();
  let gymWorkout = null;
  Object.entries(parsed).forEach(([exId, entries]) => {
    if (exId === 'Note') return;
    entries.forEach(e => { if (e.iso === iso && e.workout) gymWorkout = e.workout; });
  });
  const notes = parsed['Note'] || [];
  let hasSurf=false, hasSession=false, hasRest=false, hasSick=false;
  notes.forEach(e => {
    if (e.iso !== iso) return;
    const s = e.sets.toLowerCase();
    if (s.startsWith('surf')) hasSurf = true;
    else if (s.startsWith('session')) hasSession = true;
    else if (s.startsWith('rest')) hasRest = true;
    else if (s.startsWith('sick')) hasSick = true;
  });
  return { gymWorkout, hasSurf, hasSession, hasRest, hasSick };
}

function getWorkoutLabel(name) {
  if (!name) return '';
  if (name.includes('Upper 1') || name.includes('Upper A')) return 'Upper 1';
  if (name.includes('Upper 2') || name.includes('Upper B')) return 'Upper 2';
  if (name.includes('Lower')) return 'Lower';
  return name.split(' ').slice(0,2).join(' ');
}

// ── HOME LABELS ───────────────────────────────────────────────────────────────
function updateLastLabels() {
  const map = {
    upper1: ['pullups','ohp'],
    upper2: ['pullups_amrap','incline_db'],
    lower:  ['rdl','bss'],
    kb:     ['kb_swings','kb_press'],
  };
  Object.entries(map).forEach(([wkId, exIds]) => {
    const el = document.getElementById('last-' + wkId);
    if (!el) return;
    let last = null;
    exIds.forEach(id => {
      const h = getAllHistory(id);
      if (h.length) { const e = h[h.length-1]; if (!last || new Date(e.iso||e.date) > new Date(last.iso||last.date)) last = e; }
    });
    el.textContent = last ? last.date : '';
  });
}

// ── CALENDAR ──────────────────────────────────────────────────────────────────
function changeMonth(dir) {
  calMonth += dir;
  if (calMonth < 0) { calMonth=11; calYear--; }
  if (calMonth > 11) { calMonth=0; calYear++; }
  renderCalendar();
}

function renderCalendar() {
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('cal-month').textContent = `${months[calMonth]} ${calYear}`;
  const grid = document.getElementById('cal-grid');
  const labels = ['M','T','W','T','F','S','S'];
  let html = labels.map(l => `<div class="cal-dl">${l}</div>`).join('');
  const first = new Date(calYear, calMonth, 1);
  const days = new Date(calYear, calMonth+1, 0).getDate();
  let start = (first.getDay()+6)%7;
  for (let i=0;i<start;i++) html += `<div class="cal-d"></div>`;
  for (let d=1; d<=days; d++) {
    const iso = fmt(new Date(calYear, calMonth, d));
    const isToday = iso === todayISO;
    const { gymWorkout, hasSurf, hasSession, hasRest, hasSick } = getDayData(iso);
    let cls = 'cal-d';
    if (isToday) cls += ' today';
    if (gymWorkout) cls += ' gym';
    else if (hasSurf) cls += ' surf';
    else if (hasSession) cls += ' session';
    else if (hasRest) cls += ' rest';
    else if (hasSick) cls += ' sick';
    html += `<div class="${cls}">${d}</div>`;
  }
  grid.innerHTML = html;
}

// ── FEED ──────────────────────────────────────────────────────────────────────
function renderFeed() {
  const feed = document.getElementById('feed');
  const parsed = parseSheetLog();
  const byDate = {};

  Object.entries(parsed).forEach(([exId, entries]) => {
    entries.forEach(e => {
      if (!byDate[e.iso]) byDate[e.iso] = { date: e.date, workout: e.workout, entries: [] };
      byDate[e.iso].entries.push({ exId, sets: e.sets, workout: e.workout });
      if (e.workout) byDate[e.iso].workout = e.workout;
    });
  });

  const sorted = Object.keys(byDate).sort((a,b) => new Date(b)-new Date(a));
  if (!sorted.length) { feed.innerHTML = '<div class="empty">No history yet.</div>'; return; }

  let html = '';
  sorted.slice(0, 60).forEach(iso => {
    const day = byDate[iso];
    const isNote = day.entries.every(e => e.exId === 'Note');
    const noteText = isNote ? day.entries[0]?.sets?.split(':')[0] || 'Activity' : '';
    const gymLabel = !isNote ? getWorkoutLabel(day.workout) : '';
    const tagCls = isNote ? (noteText.toLowerCase().includes('surf') ? 'tag-surf' : noteText.toLowerCase().includes('session') ? 'tag-session' : noteText.toLowerCase().includes('rest') ? 'tag-rest' : 'tag-rest') : 'tag-gym';
    const tagText = isNote ? noteText : gymLabel;

    html += `<div class="feed-day">
      <div class="feed-day-hdr">
        <div class="feed-day-date">${day.date}</div>
        <div class="feed-day-tag ${tagCls}">${tagText}</div>
      </div>`;

    if (!isNote) {
      day.entries.forEach(e => {
        const ex = Object.values(WORKOUTS).flatMap(w=>w.exercises).find(x=>x.id===e.exId);
        const name = ex ? ex.name : e.exId;
        html += `<div class="feed-ex"><div class="feed-ex-name">${name}</div><div class="feed-ex-sets">${e.sets}</div></div>`;
      });
    } else {
      day.entries.forEach(e => {
        html += `<div class="feed-ex"><div class="feed-ex-sets" style="color:var(--muted)">${e.sets.substring(0,80)}${e.sets.length>80?'…':''}</div></div>`;
      });
    }

    html += `</div>`;
  });
  feed.innerHTML = html;
}

// ── WORKOUT VIEW ──────────────────────────────────────────────────────────────
function selectWorkout(id) {
  activeWorkout = id; openCards = new Set(); setCounters = {};
  const wk = WORKOUTS[id];
  document.getElementById('home-view').style.display = 'none';
  const wkView = document.getElementById('wk-view');
  wkView.style.display = 'block';
  wkView.style.pointerEvents = 'auto';
  document.getElementById('wv-title').textContent = wk.name;
  document.getElementById('wv-goal').textContent = wk.goal;
  document.getElementById('wv-date').textContent = todayShort;
  renderWorkout();
}

function closeWorkout() {
  activeWorkout = null;
  document.getElementById('home-view').style.display = 'block';
  const wkView = document.getElementById('wk-view');
  wkView.style.display = 'none';
  wkView.style.pointerEvents = 'none';
  updateLastLabels();
}

function renderWorkout() {
  const wk = WORKOUTS[activeWorkout];
  let html = '<div style="height:10px"></div>';

  wk.exercises.forEach(ex => {
    const hist = getAllHistory(ex.id);
    const last = hist.length ? hist[hist.length-1] : null;
    const isOpen = openCards.has(ex.id);

    if (!setCounters[ex.id]) {
      let d = 3;
      if (last?.sets) { const m=last.sets.match(/[×x]/gi); if(m) d=m.length; else {const s=(last.sets.match(/\//g)||[]).length; d=s>0?s+1:3;} }
      if (PULLUP_IDS.includes(ex.id)) d = Math.max(d, 4);
      setCounters[ex.id] = d;
    }

    html += `<div class="ex-card ${isOpen?'open':''}" id="card-${ex.id}">
      <div class="ex-hdr" onclick="toggleCard('${ex.id}')">
        <div class="ex-hdr-left">
          <div class="ex-hdr-name">${ex.name}</div>
          <div class="ex-hdr-scheme">${ex.scheme}</div>
        </div>
        <div class="ex-hdr-right">
          ${last ? `<div class="ex-last">${last.sets}</div><div class="ex-last-date">${last.date}</div>` : ''}
        </div>
        <div class="ch">▼</div>
      </div>
      <div class="ex-body">
        ${renderHist(hist, ex.id)}
        ${renderForm(ex)}
      </div>
    </div>`;
  });

  document.getElementById('wv-content').innerHTML = html;
}

function toggleCard(id) {
  if (openCards.has(id)) openCards.delete(id);
  else { openCards.clear(); openCards.add(id); }
  renderWorkout();
  setTimeout(() => { const el=document.getElementById('card-'+id); if(el) el.scrollIntoView({behavior:'smooth',block:'nearest'}); }, 60);
}

function sumReps(s) {
  const m = s.match(/[×x]\s*(\d+(?:\.\d+)?)/gi)||[];
  if (m.length) return m.reduce((t,x)=>t+parseFloat(x.replace(/[×x\s]/i,'')),0);
  return s.split('/').map(p=>parseFloat(p.trim())).filter(n=>!isNaN(n)).reduce((t,n)=>t+n,0);
}

function renderHist(hist, exId) {
  if (!hist.length) return '<div style="padding:6px 0;font-size:11px;color:var(--muted)">No history.</div>';
  const isPullup = PULLUP_IDS.includes(exId);
  const rows = hist.map((h,i) => {
    const canEdit = h.sheetRow || (localLog[exId]||[]).some(l=>l.date===h.date&&l.sets===h.sets);
    const total = isPullup ? sumReps(h.sets) : 0;
    return `<div class="hist-row">
      <span class="hist-date">${h.date}</span>
      <span class="hist-sets">${h.sets}</span>
      ${isPullup&&total>0?`<span class="hist-reps">${total}r</span>`:''}
      ${canEdit?`<button class="edit-btn" onclick="openEdit('${exId}',${i},event)">edit</button>`:''}
    </div>`;
  }).join('');
  return `<div class="hist">${rows}</div><div class="divider"></div>`;
}

function renderForm(ex) {
  const hist = getAllHistory(ex.id);
  const isDose = ex.track === 'dose';
  const hasHist = hist.length > 0;
  const last = hist.length ? hist[hist.length-1] : null;

  let d = isDose ? 2 : 3;
  if (last?.sets) { const m=last.sets.match(/[×x]/gi); if(m) d=m.length; else {const s=(last.sets.match(/\//g)||[]).length; d=s>0?s+1:isDose?2:3;} }
  if (PULLUP_IDS.includes(ex.id)) d = Math.max(d, 4);
  if (!setCounters[ex.id]) setCounters[ex.id] = d;

  let html = '';

  // Variant selector
  if (ex.options?.length) {
    const sel = exerciseVariants[ex.id] || ex.options[0];
    html += `<div style="display:flex;gap:5px;flex-wrap:wrap;padding:8px 0 4px">`;
    ex.options.forEach(opt => {
      const isSel = opt===sel;
      html += `<button onclick="selVariant('${ex.id}','${opt}')" style="background:${isSel?'var(--accent)':'var(--bg)'};color:${isSel?'#000':'var(--muted)'};border:1px solid ${isSel?'var(--accent)':'var(--border)'};padding:5px 10px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:11px;font-weight:600">${opt}</button>`;
    });
    html += `</div>`;
  }

  html += `<div class="date-row" style="margin-top:6px">
    <span class="date-lbl">Date</span>
    <input type="date" id="logdate-${ex.id}" value="${todayISO}" class="date-in">
  </div>`;

  // Pull-up target
  if (PULLUP_IDS.includes(ex.id)) {
    html += `<div class="target-row">
      <span class="date-lbl" style="flex-shrink:0">Target</span>
      <input type="number" inputmode="numeric" id="target-${ex.id}" placeholder="e.g. 28" class="target-in" oninput="updateTotal('${ex.id}')">
      <span class="total-lbl">Total: <span id="reptotal-${ex.id}" style="font-weight:600;color:var(--text)">0</span></span>
    </div>`;
  }

  // Weight + checkbox (KB session style)
  if (ex.track === 'wt_check') {
    const isDone = (last?.date === todayShort && last?.sets !== '');
    html += `<div style="display:flex;align-items:center;gap:10px;padding:8px 0">
      <input type="text" inputmode="decimal" id="wt-${ex.id}" placeholder="lb" value="${last?.sets?.match(/^(\d+)/)?.[1]||''}"
        style="width:64px;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:inherit;font-size:15px;font-weight:600;padding:7px 8px;text-align:center;outline:none">
      <span style="font-size:13px;color:var(--muted)">lb</span>
      <button class="dose-check ${isDone?'checked':''}" id="dose-${ex.id}" onclick="logWtCheck('${ex.id}')"></button>
      <span style="font-size:12px;color:var(--muted)">${isDone?'Done today':'Mark done'}</span>
    </div>`;
    return html;
  }

  // Dose: checkbox + optional expand
  if (isDose) {
    const isDone = (last?.date === todayShort);
    html += `<div class="dose-row">
      <button class="dose-check ${isDone?'checked':''}" id="dose-${ex.id}" onclick="logDose('${ex.id}')"></button>
      <span class="dose-label">${isDone ? 'Done today' : 'Mark done'}</span>
      <span class="dose-expand" onclick="toggleDoseExpand('${ex.id}')">+ reps</span>
    </div>
    <div id="dose-expand-${ex.id}" style="display:none">
      <div class="sets-wrap" id="sets-${ex.id}"></div>
      <div class="btns">
        <button class="btn btn-add" onclick="addSet('${ex.id}')">+ Set</button>
        <button class="btn btn-log" onclick="logEx('${ex.id}')">Log ✓</button>
      </div>
    </div>`;
    return html;
  }

  // Full set builder
  const selVariant = ex.options ? (exerciseVariants[ex.id]||ex.options[0]) : null;
  const isWeighted = ex.weighted;
  let rows = '';
  for (let i=1; i<=setCounters[ex.id]; i++) rows += buildRow(ex, i, isWeighted);
  html += `<div class="sets-wrap" id="sets-${ex.id}">${rows}</div>
    <div class="btns">
      <button class="btn btn-add" onclick="addSet('${ex.id}')">+ Set</button>
      <button class="btn btn-log" onclick="logEx('${ex.id}')">Log ✓</button>
    </div>`;
  return html;
}

function buildRow(ex, num, weighted) {
  const bw = ex.bwOption;
  let inp = '';
  if (weighted) {
    inp += `<input type="text" inputmode="decimal" placeholder="${bw?'BW/lb':'lb'}" class="wi" id="${ex.id}-w${num}">`;
    inp += `<span class="x-lbl">×</span>`;
    inp += `<input type="number" inputmode="numeric" placeholder="reps" class="ri" id="${ex.id}-r${num}" oninput="updateTotal('${ex.id}')">`;
  } else {
    inp += `<input type="text" placeholder="reps/note" class="ni" id="${ex.id}-r${num}">`;
  }
  return `<div class="set-row" id="sr-${ex.id}-${num}">
    <span class="set-n">${num}</span>${inp}
    ${num>1?`<button class="rm-set" onclick="rmSet('${ex.id}',${num})">×</button>`:''}
  </div>`;
}

function addSet(exId) {
  const ex = WORKOUTS[activeWorkout].exercises.find(e=>e.id===exId);
  if (!ex) return;
  setCounters[exId] = (setCounters[exId]||3)+1;
  const container = document.getElementById('sets-'+exId);
  if (!container) return;
  const div = document.createElement('div');
  div.innerHTML = buildRow(ex, setCounters[exId], ex.weighted);
  container.appendChild(div.firstElementChild);
}
function rmSet(exId, num) { const r=document.getElementById(`sr-${exId}-${num}`); if(r) r.remove(); }

function updateTotal(exId) {
  let total=0;
  document.querySelectorAll(`[id^="sr-${exId}-"]`).forEach(row => {
    const num=row.id.split('-').pop();
    const rEl=document.getElementById(`${exId}-r${num}`);
    if(rEl) total+=parseFloat(rEl.value)||0;
  });
  const el=document.getElementById('reptotal-'+exId);
  const tEl=document.getElementById('target-'+exId);
  if(!el) return;
  const target=tEl?parseFloat(tEl.value)||0:0;
  el.textContent=total;
  el.style.color=target>0?(total>=target?'var(--accent)':'var(--text)'):'var(--text)';
}

function logWtCheck(exId) {
  const wtEl = document.getElementById('wt-' + exId);
  const wt = wtEl ? wtEl.value.trim() : '';
  const rawDate = document.getElementById('logdate-' + exId)?.value || todayISO;
  const d = new Date(rawDate + 'T12:00:00');
  const displayDate = d.toLocaleDateString('en-US', {month:'numeric',day:'numeric',year:'2-digit'});
  const sets = wt ? `${wt}lb ✓` : '✓ done';
  postToSheet(rawDate, WORKOUTS[activeWorkout].name, exId, sets, displayDate);
}

function logDose(exId) {
  const rawDate = document.getElementById('logdate-'+exId)?.value||todayISO;
  const d = new Date(rawDate+'T12:00:00');
  const displayDate = d.toLocaleDateString('en-US',{month:'numeric',day:'numeric',year:'2-digit'});
  postToSheet(rawDate, WORKOUTS[activeWorkout].name, exId, '✓ done', displayDate);
}

function toggleDoseExpand(exId) {
  const panel = document.getElementById('dose-expand-'+exId);
  if (!panel) return;
  const isOpen = panel.style.display !== 'none';
  panel.style.display = isOpen ? 'none' : 'block';
  if (!isOpen) {
    const ex = WORKOUTS[activeWorkout].exercises.find(e=>e.id===exId);
    const container = document.getElementById('sets-'+exId);
    if (ex && container && !container.innerHTML) {
      setCounters[exId] = setCounters[exId]||2;
      let rows='';
      for(let i=1;i<=setCounters[exId];i++) rows+=buildRow(ex,i,ex.weighted);
      container.innerHTML=rows;
    }
  }
}

function logEx(exId) {
  const rows = document.querySelectorAll(`[id^="sr-${exId}-"]`);
  let parts=[];
  rows.forEach(row=>{
    const num=row.id.split('-').pop();
    const wEl=document.getElementById(`${exId}-w${num}`);
    const rEl=document.getElementById(`${exId}-r${num}`);
    if(wEl&&rEl){const w=wEl.value.trim(),r=rEl.value.trim();if(w||r){const wL=(!w||w.toLowerCase()==='bw')?'BW':w;parts.push(r?`${wL}×${r}`:wL);}}
    else if(rEl){const r=rEl.value.trim();if(r)parts.push(r);}
  });
  if(!parts.length){showToast('Nothing to log');return;}
  const setsStr=parts.join(' / ');
  const rawDate=document.getElementById('logdate-'+exId)?.value||todayISO;
  const d=new Date(rawDate+'T12:00:00');
  const displayDate=d.toLocaleDateString('en-US',{month:'numeric',day:'numeric',year:'2-digit'});
  const ex=WORKOUTS[activeWorkout].exercises.find(e=>e.id===exId);
  const variant=ex?.options?exerciseVariants[exId]:null;
  const finalSets=variant?`${variant}: ${setsStr}`:setsStr;
  postToSheet(rawDate, WORKOUTS[activeWorkout].name, exId, finalSets, displayDate);
}

function postToSheet(rawDate, workout, exId, sets, displayDate) {
  if(!localLog[exId]) localLog[exId]=[];
  localLog[exId].push({date:displayDate,sets,iso:rawDate});
  try{localStorage.setItem('gymlog_v2',JSON.stringify(localLog));}catch(e){}
  openCards.delete(exId);
  showToast('Syncing...');
  renderWorkout();
  fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({date:rawDate,workout,exercise:exId,sets})
  }).then(()=>{showToast('Logged ✓');loadAll();}).catch(()=>showToast('Saved locally'));
}

function selVariant(exId, variant) {
  exerciseVariants[exId]=variant;
  try{localStorage.setItem('exercise_variants',JSON.stringify(exerciseVariants));}catch(e){}
  renderWorkout();
}

// ── EDIT ─────────────────────────────────────────────────────────────────────
function openEdit(exId, idx, event) {
  event.stopPropagation();
  const hist=getAllHistory(exId);
  const entry=hist[idx];
  if(!entry) return;
  editExId=exId; editHistIdx=idx;
  document.getElementById('edit-subtitle').textContent = Object.values(WORKOUTS).flatMap(w=>w.exercises).find(e=>e.id===exId)?.name||exId;
  document.getElementById('edit-date').value=entry.date;
  document.getElementById('edit-sets').value=entry.sets;
  document.getElementById('edit-modal').classList.add('on');
}
function closeEdit(){document.getElementById('edit-modal').classList.remove('on');editExId=null;editHistIdx=null;}

function saveEdit(){
  const newDate=document.getElementById('edit-date').value.trim();
  const newSets=document.getElementById('edit-sets').value.trim();
  if(!newDate||!newSets){showToast('Fill both fields');return;}
  const hist=getAllHistory(editExId);
  const entry=hist[editHistIdx];
  if(entry.sheetRow){
    fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'edit',rowNumber:entry.sheetRow,date:newDate,workout:entry.workout||'',exercise:editExId,sets:newSets})
    }).then(()=>{loadAll();showToast('Updated ✓');}).catch(()=>showToast('Error'));
  } else {
    const arr=localLog[editExId]||[];
    const i=arr.findIndex(l=>l.date===entry.date&&l.sets===entry.sets);
    if(i!==-1){arr[i]={date:newDate,sets:newSets};localLog[editExId]=arr;try{localStorage.setItem('gymlog_v2',JSON.stringify(localLog));}catch(e){}}
    showToast('Updated ✓');renderWorkout();
  }
  closeEdit();
}

function deleteEntry(){
  const hist=getAllHistory(editExId);
  const entry=hist[editHistIdx];
  if(entry.sheetRow){
    fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'delete',rowNumber:entry.sheetRow})
    }).then(()=>{loadAll();showToast('Deleted');}).catch(()=>showToast('Error'));
  } else {
    const arr=localLog[editExId]||[];
    const i=arr.findIndex(l=>l.date===entry.date&&l.sets===entry.sets);
    if(i!==-1){arr.splice(i,1);localLog[editExId]=arr;try{localStorage.setItem('gymlog_v2',JSON.stringify(localLog));}catch(e){}}
    showToast('Deleted');renderWorkout();
  }
  closeEdit();
}

// ── ACTIVITY ─────────────────────────────────────────────────────────────────
function logQuickActivity(type) {
  if(type==='surf'){document.getElementById('surf-date').value=todayISO;surfEffort=null;document.getElementById('surf-loc').value='';document.getElementById('surf-dur').value='';document.querySelectorAll('#surf-modal .eff-btn').forEach(b=>b.classList.remove('on'));document.getElementById('surf-modal').classList.add('on');}
  else if(type==='session'){document.getElementById('session-date').value=todayISO;sessionEffort=null;document.getElementById('session-det').value='';document.querySelectorAll('#session-modal .eff-btn').forEach(b=>b.classList.remove('on'));document.getElementById('session-modal').classList.add('on');}
  else if(type==='rest'||type==='sick'){
    document.getElementById('simple-activity-type').value=type;
    document.getElementById('simple-activity-label').textContent=type==='rest'?'Rest Day':'Sick Day';
    document.getElementById('simple-activity-date').value=todayISO;
    document.getElementById('simple-activity-modal').classList.add('on');
  }
}
function saveSimpleActivity() {
  const type = document.getElementById('simple-activity-type').value;
  const date = document.getElementById('simple-activity-date').value || todayISO;
  const sets = type === 'rest' ? 'Rest day' : 'Sick day';
  document.getElementById('simple-activity-modal').classList.remove('on');
  showToast('Syncing...');
  fetch(SHEET_URL, {method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},
    body: JSON.stringify({date, workout:'Activity Log', exercise:'Note', sets})
  }).then(()=>{showToast('Logged ✓');loadAll();}).catch(()=>showToast('Error'));
}

function setEff(n){surfEffort=n;document.querySelectorAll('#surf-modal .eff-btn').forEach((b,i)=>b.classList.toggle('on',i+1===n));}
function setSessEff(n){sessionEffort=n;document.querySelectorAll('#session-modal .eff-btn').forEach((b,i)=>b.classList.toggle('on',i+1===n));}
function closeSurfModal(){document.getElementById('surf-modal').classList.remove('on');}
function closeSessionModal(){document.getElementById('session-modal').classList.remove('on');}

function saveSurf(){
  const loc=document.getElementById('surf-loc').value.trim();
  const dur=document.getElementById('surf-dur').value.trim();
  if(!loc||!dur){showToast('Fill in location and duration');return;}
  const date=document.getElementById('surf-date').value||todayISO;
  let sets=`Surf: ${loc}, ${dur}hr`;
  if(surfEffort) sets+=`, effort ${surfEffort}/5`;
  fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({date,workout:'Activity Log',exercise:'Note',sets})
  }).then(()=>{showToast('Logged ✓');loadAll();}).catch(()=>showToast('Error'));
  closeSurfModal();showToast('Syncing...');
}

function saveSession(){
  const det=document.getElementById('session-det').value.trim();
  const date=document.getElementById('session-date').value||todayISO;
  let sets=det?`Session: ${det}`:'Session';
  if(sessionEffort) sets+=` | Effort ${sessionEffort}/5`;
  fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({date,workout:'Activity Log',exercise:'Note',sets})
  }).then(()=>{showToast('Logged ✓');loadAll();}).catch(()=>showToast('Error'));
  closeSessionModal();showToast('Syncing...');
}
